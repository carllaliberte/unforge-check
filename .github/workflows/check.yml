name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify-self:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install 'cryptography>=48'
      - run: python -m compileall -q check.py
      - run: python check.py -h
