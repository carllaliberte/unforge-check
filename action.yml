name: UNFORGE Check
description: Verify a file against its .unforge.json. No node. No keys.
author: Carl Laliberté
branding:
  icon: shield
  color: gray-dark
inputs:
  file:
    description: Path to the attested file
    required: true
  proof:
    description: Path to the .unforge.json
    required: true
  python-version:
    description: Python for the checker
    required: false
    default: "3.12"
runs:
  using: composite
  steps:
    - name: Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Check
      shell: bash
      run: |
        pip install -q -r "$GITHUB_ACTION_PATH/requirements.txt"
        python "$GITHUB_ACTION_PATH/check.py" "${{ inputs.file }}" "${{ inputs.proof }}"
